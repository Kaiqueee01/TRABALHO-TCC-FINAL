<path d="M 400 375 L 540 520 L 1110 665" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/><text x="735" y="525" text-anchor="middle" font-size="15" font-weight="600" fill="#7C3AED">1:N SET NULL</text>

