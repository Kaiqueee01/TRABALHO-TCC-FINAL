  <text x="760" y="719" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400" fill="#111827" stroke="none">Observacao</text>
<text x="760" y="742" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400" fill="#111827" stroke="none">A tabela farmacias existe no schema</text>
<text x="760" y="765" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400" fill="#111827" stroke="none">atual, mas ainda nao possui chave</text>
<text x="760" y="788" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400" fill="#111827" stroke="none">estrangeira ligada a receitas ou</text>
<text x="760" y="811" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="400" fill="#111827" stroke="none">clientes.</text>
</g>
<line x1="400" y1="270" x2="585" y2="270" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)"/><text x="492.5" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#16A34A">1:N</text>
<text x="492" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A" stroke="none">CASCADE</text>
