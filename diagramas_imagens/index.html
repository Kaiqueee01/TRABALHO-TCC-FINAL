<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagramas IMR</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #eef2f7; color: #111827; }
    main { width: min(1500px, calc(100% - 32px)); margin: 24px auto; display: grid; gap: 28px; }
    section { background: #fff; border: 1px solid #d8e0ec; border-radius: 8px; padding: 16px; }
    h1 { margin: 0 0 10px; }
    h2 { margin: 0 0 14px; font-size: 22px; }
    img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Diagramas do Sistema IMR</h1>
    <section><h2>Caso de Uso</h2><img src="01_caso_de_uso.svg" alt="Caso de Uso"></section>
<section><h2>Sequencia</h2><img src="02_diagrama_de_sequencia.svg" alt="Sequencia"></section>
<section><h2>Atividades</h2><img src="03_diagrama_de_atividades.svg" alt="Atividades"></section>
<section><h2>Classes Conceituais</h2><img src="04_classes_conceituais.svg" alt="Classes Conceituais"></section>
<section><h2>Entidade e Relacionamento</h2><img src="05_entidade_relacionamento.svg" alt="Entidade e Relacionamento"></section>
  </main>
</body>
</html>
