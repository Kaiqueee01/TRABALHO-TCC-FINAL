<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #475569; }
      .actor-line { stroke: #111827; stroke-width: 3; stroke-linecap: round; fill: none; }
      .actor-text { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; fill: #111827; }
      .actor-note { font-family: Arial, Helvetica, sans-serif; font-size: 15px; text-anchor: middle; fill: #475569; }
      .usecase { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.2; }
      .usecase-admin { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.2; }
      .usecase-shared { fill: #fff7ed; stroke: #f97316; stroke-width: 2.2; }
      .usecase-text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; fill: #0f172a; }
      .assoc { stroke: #334155; stroke-width: 2; fill: none; }
      .include { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#openArrow); }
      .include-text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #475569; }
      .legend-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .legend-text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #334155; }
    </style>
    <marker id="openArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#64748b" stroke-width="2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="800" y="46" text-anchor="middle">Diagrama de Caso de Uso - Sistema IMR</text>
  <text class="subtitle" x="800" y="76" text-anchor="middle">Sistema de Monitoramento de Receitas Medicas</text>

  <rect class="boundary" x="290" y="105" width="990" height="805" rx="12"/>
  <text class="subtitle" x="785" y="138" text-anchor="middle">Sistema IMR</text>

  <!-- Ator: Cliente/Paciente -->
  <g transform="translate(130 365)">
    <circle class="actor-line" cx="0" cy="-72" r="24"/>
    <path class="actor-line" d="M 0 -48 L 0 30"/>
    <path class="actor-line" d="M -42 -16 L 42 -16"/>
    <path class="actor-line" d="M 0 30 L -38 90"/>
    <path class="actor-line" d="M 0 30 L 38 90"/>
    <text class="actor-text" x="0" y="130">Cliente</text>
    <text class="actor-note" x="0" y="153">Paciente</text>
  </g>

  <!-- Ator: Administrador -->
  <g transform="translate(1470 360)">
    <circle class="actor-line" cx="0" cy="-72" r="24"/>
    <path class="actor-line" d="M 0 -48 L 0 30"/>
    <path class="actor-line" d="M -42 -16 L 42 -16"/>
    <path class="actor-line" d="M 0 30 L -38 90"/>
    <path class="actor-line" d="M 0 30 L 38 90"/>
    <text class="actor-text" x="0" y="130">Administrador</text>
  </g>

  <!-- Ator: Servico SMS -->
  <g transform="translate(1470 745)">
    <circle class="actor-line" cx="0" cy="-72" r="24"/>
    <path class="actor-line" d="M 0 -48 L 0 30"/>
    <path class="actor-line" d="M -42 -16 L 42 -16"/>
    <path class="actor-line" d="M 0 30 L -38 90"/>
    <path class="actor-line" d="M 0 30 L 38 90"/>
    <text class="actor-text" x="0" y="130">Servico SMS</text>
    <text class="actor-note" x="0" y="153">Twilio</text>
  </g>

  <!-- Associacoes do cliente -->
  <path class="assoc" d="M 175 300 L 388 175"/>
  <path class="assoc" d="M 175 315 L 388 285"/>
  <path class="assoc" d="M 175 330 L 388 395"/>
  <path class="assoc" d="M 175 350 L 388 505"/>
  <path class="assoc" d="M 175 368 L 628 230"/>
  <path class="assoc" d="M 175 388 L 628 345"/>
  <path class="assoc" d="M 175 408 L 628 460"/>
  <path class="assoc" d="M 175 428 L 388 625"/>

  <!-- Associacoes do administrador -->
  <path class="assoc" d="M 1425 292 L 1132 175"/>
  <path class="assoc" d="M 1425 312 L 1132 285"/>
  <path class="assoc" d="M 1425 332 L 1132 400"/>
  <path class="assoc" d="M 1425 352 L 1132 515"/>
  <path class="assoc" d="M 1425 372 L 1132 630"/>
  <path class="assoc" d="M 1425 392 L 1132 745"/>
  <path class="assoc" d="M 1425 275 L 612 285"/>

  <!-- Associacao do servico externo -->
  <path class="assoc" d="M 1425 690 L 1132 635"/>

  <!-- Casos de uso do cliente -->
  <ellipse class="usecase" cx="500" cy="175" rx="112" ry="42"/>
  <text class="usecase-text" x="500" y="181">Cadastrar-se</text>

  <ellipse class="usecase-shared" cx="500" cy="285" rx="112" ry="42"/>
  <text class="usecase-text" x="500" y="291">Realizar login</text>

  <ellipse class="usecase" cx="500" cy="395" rx="112" ry="42"/>
  <text class="usecase-text" x="500" y="391">Recuperar</text>
  <text class="usecase-text" x="500" y="414">senha</text>

  <ellipse class="usecase" cx="500" cy="505" rx="112" ry="42"/>
  <text class="usecase-text" x="500" y="501">Atualizar dados</text>
  <text class="usecase-text" x="500" y="524">pessoais</text>

  <ellipse class="usecase" cx="500" cy="625" rx="112" ry="42"/>
  <text class="usecase-text" x="500" y="621">Consultar</text>
  <text class="usecase-text" x="500" y="644">notificacoes</text>

  <!-- Casos de uso de receitas do cliente -->
  <ellipse class="usecase-shared" cx="760" cy="130" rx="122" ry="42"/>
  <text class="usecase-text" x="760" y="126">Anexar arquivo</text>
  <text class="usecase-text" x="760" y="149">da receita</text>

  <ellipse class="usecase" cx="760" cy="230" rx="132" ry="42"/>
  <text class="usecase-text" x="760" y="226">Cadastrar receita</text>
  <text class="usecase-text" x="760" y="249">medica</text>

  <ellipse class="usecase" cx="760" cy="345" rx="132" ry="42"/>
  <text class="usecase-text" x="760" y="341">Editar receita</text>
  <text class="usecase-text" x="760" y="364">medica</text>

  <ellipse class="usecase" cx="760" cy="460" rx="132" ry="42"/>
  <text class="usecase-text" x="760" y="456">Consultar minhas</text>
  <text class="usecase-text" x="760" y="479">receitas</text>

  <!-- Casos de uso do administrador -->
  <ellipse class="usecase-admin" cx="1030" cy="175" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="171">Acessar painel</text>
  <text class="usecase-text" x="1030" y="194">administrativo</text>

  <ellipse class="usecase-admin" cx="1030" cy="285" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="281">Gerenciar</text>
  <text class="usecase-text" x="1030" y="304">clientes</text>

  <ellipse class="usecase-admin" cx="1030" cy="400" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="396">Gerenciar</text>
  <text class="usecase-text" x="1030" y="419">receitas</text>

  <ellipse class="usecase-admin" cx="1030" cy="515" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="511">Consultar avisos</text>
  <text class="usecase-text" x="1030" y="534">gerais</text>

  <ellipse class="usecase-admin" cx="1030" cy="630" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="626">Enviar SMS</text>
  <text class="usecase-text" x="1030" y="649">ao cliente</text>

  <ellipse class="usecase-admin" cx="1030" cy="745" rx="112" ry="42"/>
  <text class="usecase-text" x="1030" y="741">Consultar historico</text>
  <text class="usecase-text" x="1030" y="764">de SMS</text>

  <!-- Relacionamentos include -->
  <path class="include" d="M 760 188 L 760 172"/>
  <text class="include-text" x="773" y="182">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M 760 303 L 760 172"/>
  <text class="include-text" x="777" y="250">&lt;&lt;include&gt;&gt;</text>

  <rect class="legend-box" x="325" y="815" width="495" height="62" rx="8"/>
  <circle cx="355" cy="842" r="8" fill="#eef6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="legend-text" x="372" y="847">Funcoes do cliente/paciente</text>
  <circle cx="575" cy="842" r="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="legend-text" x="592" y="847">Funcoes administrativas</text>
  <circle cx="355" cy="865" r="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="legend-text" x="372" y="870">Caso compartilhado ou complementar</text>
</svg>
