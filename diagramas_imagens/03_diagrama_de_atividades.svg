  <text x="750" y="1553.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Exibir alerta de</text>
<text x="750" y="1576.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">vencimento</text>
</g>
<g id="alert3">
  <rect x="1010" y="1530" width="260" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="1140" y="1553.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Exibir lembrete de</text>
<text x="1140" y="1576.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">retirada</text>
</g>
