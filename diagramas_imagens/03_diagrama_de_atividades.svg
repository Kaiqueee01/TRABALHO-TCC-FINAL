  <text x="1045" y="544.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Area do cliente</text>
<text x="1045" y="567.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Consulta dados e receitas</text>
<text x="1045" y="590.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">proprias</text>
</g>
