      <path d="M 0 0 L 14 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="750" y="46" text-anchor="middle" font-size="28" font-weight="800" fill="#111827">Sistema IMR - Diagrama de Atividades</text>
  
<g id="start">
  <ellipse cx="750" cy="125" rx="100" ry="35" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="750" y="125" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="700" fill="#111827" stroke="none">Inicio</text>
</g>
<g id="login">
  <rect x="610" y="205" width="280" height="80" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
  <text x="750" y="245" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Usuario realiza login</text>
</g>
<g id="profile">
  <polygon points="750,310 860,375 750,440 640,375" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="750" y="375" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="500" fill="#111827" stroke="none">Perfil de acesso?</text>
</g>
<g id="admin">
  <rect x="300" y="520" width="310" height="95" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="455" y="544.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Area administrativa</text>
<text x="455" y="567.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Gerencia clientes, receitas e</text>
<text x="455" y="590.5" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">SMS</text>
</g>
<g id="client">
