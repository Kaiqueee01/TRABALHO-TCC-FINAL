  <text x="750" y="1041" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">Salvar receita no MySQL</text>
<text x="750" y="1064" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="#111827" stroke="none">e arquivo em uploads</text>
</g>
<g id="calc">
