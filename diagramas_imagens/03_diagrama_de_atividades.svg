  <text x="1140" y="1349.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="500" fill="#111827" stroke="none">Retirada hoje ou em ate</text>
<text x="1140" y="1370.5" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="500" fill="#111827" stroke="none">3 dias?</text>
</g>
